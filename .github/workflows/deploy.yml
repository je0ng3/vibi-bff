name: Deploy to Cloud Run

# main 푸시 / 수동 트리거 시 배포. 민감 시크릿(DB/JWT/API 키 등)은 Secret Manager 참조(--set-secrets),
# 그 외 설정·비민감 값은 GitHub Secrets/Variables → env-var 주입(--set-env-vars).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVICE_NAME: vibi-bff
  REGION: us-central1
  PERSO_BASE_URL: https://api.perso.ai
  PERSO_STORAGE_BASE_URL: https://portal-media.perso.ai
  STORAGE_PATH: /tmp/storage

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # WIF OIDC

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # admin-ui 빌드 산출물은 .gitignore — 매 배포마다 build 해서 src/main/resources/admin/ 로 떨군다.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-ui/package-lock.json

      - name: Build admin-ui (vite)
        working-directory: admin-ui
        env:
          VITE_GOOGLE_OAUTH_CLIENT_ID_ADMIN: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_ADMIN }}
        run: |
          npm ci --silent
          npm run build

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # BFF_BASE_URL: vars.BFF_BASE_URL 우선, 없으면 기존 Cloud Run URL, 최초 배포면 빈 값(다음 push 에서 채움).
      - name: Determine BFF_BASE_URL
        id: bff_url
        run: |
          URL="${{ vars.BFF_BASE_URL }}"
          if [ -z "$URL" ]; then
            URL=$(gcloud run services describe "$SERVICE_NAME" \
              --region "$REGION" --project "${{ secrets.GCP_PROJECT_ID }}" \
              --format='value(status.url)' 2>/dev/null || echo "")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # 민감 시크릿은 --set-secrets 로 Secret Manager 참조(콘솔/리비전에 평문 미노출 + ^@^ 구분자
      # 충돌 회피). --set-env-vars 에는 URL/플래그/OAuth client id 등 비민감 값만 둔다.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --service-account "${{ secrets.GCP_RUNTIME_SA_EMAIL }}" \
            --execution-environment gen2 \
            --cpu 1 --memory 2Gi --cpu-boost \
            --timeout 600 \
            --concurrency 4 \
            --min-instances 0 --max-instances 2 \
            --no-cpu-throttling \
            --session-affinity \
            --allow-unauthenticated \
            --set-env-vars "^@^PERSO_BASE_URL=${PERSO_BASE_URL}@PERSO_STORAGE_BASE_URL=${PERSO_STORAGE_BASE_URL}@STORAGE_PATH=${STORAGE_PATH}@GOOGLE_OAUTH_CLIENT_IDS=${{ secrets.GOOGLE_OAUTH_CLIENT_IDS }}@GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}@GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}@APPLE_OAUTH_CLIENT_IDS=${{ secrets.APPLE_OAUTH_CLIENT_IDS }}@CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}@R2_BUCKET=${{ vars.R2_BUCKET }}@R2_ACCOUNT_ID=${{ vars.R2_ACCOUNT_ID }}@ADMIN_SLUG=${{ secrets.ADMIN_SLUG }}@BFF_BASE_URL=${{ steps.bff_url.outputs.url }}@RATE_LIMIT_TRUSTED_PROXY_HOPS=${{ vars.RATE_LIMIT_TRUSTED_PROXY_HOPS }}" \
            --set-secrets "PERSO_API_KEY=PERSO_API_KEY:latest,PERSO_SPACE_SEQ=PERSO_SPACE_SEQ:latest,AUTH_JWT_SECRET=AUTH_JWT_SECRET:latest,SEPARATION_SIGNING_SECRET=SEPARATION_SIGNING_SECRET:latest,DATABASE_URL=DATABASE_URL:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest" \
            --quiet
          echo "::notice title=Deployed::${{ steps.bff_url.outputs.url }}"
